<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PROSSAHEL Terrain — Suivi MC, Collecte GPS & Carte A4</title>
<style>
:root{--bg:#f1f5f9;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--pri:#0b6e4f;--pri2:#095a40;--slate:#0f172a;--acc:#f59e0b;--ok:#059669;--err:#dc2626;--info:#0369a1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:40;min-height:57px;background:#fff;border-bottom:1px solid var(--line);padding:6px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px;letter-spacing:-.01em;color:var(--pri);display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand-badge{background:var(--pri);color:#fff;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:700;letter-spacing:.04em}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nav button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:6px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.nav button.active{background:var(--slate);color:#fff}
.nav button:hover:not(.active){background:#f1f5f9;color:var(--ink)}
.btn{border:1px solid #cbd5e1;background:#fff;color:var(--ink);padding:7px 11px;border-radius:6px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;white-space:nowrap;text-decoration:none}
.btn:hover{background:#f8fafc}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.dark{background:var(--slate);border-color:var(--slate);color:#fff}
.btn.dark:hover{background:#1e293b}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--slate)}
.btn.acc:hover{background:#fbbf24}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.err{background:var(--err);border-color:var(--err);color:#fff}
.btn.sm{min-height:27px;padding:4px 9px;font-size:11.5px}
.wrap{max-width:1320px;margin:0 auto;padding:16px}
.panel{display:none}
.panel.active{display:block}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.subtabs button{border:1px solid var(--line);background:#fff;color:var(--muted);padding:7px 11px;border-radius:6px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.subtabs button.active{background:var(--pri);border-color:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;color:var(--pri);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:#475569}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;font-size:12.5px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
input[readonly]{background:#f8fafc;color:#334155}
.kpi-row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center}
.kpi.good{border-color:#86efac;background:#f0fdf4}
.kpi.warn{border-color:#fcd34d;background:#fffbeb}
.kpi.bad{border-color:#fca5a5;background:#fef2f2}
.kpi .lbl{font-size:11px;color:#475569;font-weight:600;margin-top:4px}
.kpi .val{font-size:20px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #f1f5f9;vertical-align:middle}
th{background:#f8fafc;color:#334155;font-size:11px;font-weight:700;white-space:nowrap}
tr:hover td{background:#f8fafc}
tr:last-child td{border-bottom:0}
.banner{padding:10px 12px;border-radius:8px;font-size:12.5px;font-weight:600;margin-bottom:12px;border:1px solid;display:flex;align-items:center;justify-content:space-between;gap:8px}
.banner.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.banner.err{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.banner.info{background:#f0f9ff;border-color:#bae6fd;color:#075985}
.iobar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;padding:8px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.iobar-grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gps-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:700;font-family:ui-monospace,monospace}
.gps-pill.ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
.gps-pill.warn{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.gps-pill.bad{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.gps-pill.wait{background:#e0f2fe;color:#075985;border:1px solid #bae6fd}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chk{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;font-size:12px;font-weight:600;cursor:pointer}
.chk input{width:auto;margin:0}
.carto-layout{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.svg-stage{background:#fff;border:1px solid #cbd5e1;border-radius:4px;box-shadow:0 8px 30px rgba(15,23,42,.1);overflow:hidden}
.svg-stage svg{width:100%;height:auto;display:block}
.filterbar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.filterbar label{min-width:130px;flex:1}
.modal-backdrop{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.open{display:flex}
.modal-box{background:#fff;border-radius:10px;max-width:840px;width:100%;max-height:86vh;overflow-y:auto;padding:20px;border:1px solid var(--line)}
.print-doc h1{color:var(--pri);font-size:18px;margin:0 0 8px}
.print-doc h2{color:var(--pri);font-size:14px;border-bottom:2px solid #14a37f;padding-bottom:4px;margin:14px 0 8px}
.print-doc table th{background:#e8f2ee}
@media(max-width:960px){.carto-layout{grid-template-columns:1fr}}
@media print{
  .no-print{display:none!important}
  body{background:#fff}
  .wrap{max-width:none;padding:0;margin:0}
  .svg-stage{border:0;box-shadow:none}
  .modal-backdrop.open{position:static;background:#fff;padding:0;display:block}
  .modal-box{border:0;max-height:none;padding:0;overflow:visible}
}
.stpw{display:flex;align-items:stretch}
.stpw input{text-align:center;font-size:18px;font-weight:700;min-width:0;width:100%;border-radius:0;padding:8px 2px}
.stb{border:1px solid #cbd5e1;background:#f8fafc;font-size:22px;font-weight:700;width:46px;min-height:44px;cursor:pointer;color:var(--pri)}
.stb:first-child{border-radius:8px 0 0 8px}
.stb:last-child{border-radius:0 8px 8px 0}
.totline{margin:10px 0;padding:10px 12px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;font-weight:600;color:var(--pri2)}
.totline b{font-size:17px}
.chipx{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#e2e8f0;color:#334155;text-decoration:none}
.c-hta{background:#fee2e2;color:#991b1b}
.c-diab{background:#dbeafe;color:#1e40af}
.c-warn{background:#fef3c7;color:#92400e}
.pcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff}
.pcard.flag{border-color:#f59e0b;background:#fffbeb}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pc-btns{display:flex;gap:8px}
.pc-btns .btn{min-height:44px;min-width:92px;font-size:14px}
.pc-form{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.empty-note{color:var(--muted);padding:14px;text-align:center}
</style>
</head>
<body>
<header class="topbar no-print">
  <div class="brand">PROSSAHEL Terrain <span class="brand-badge">OFFLINE PRO</span></div>
  <nav class="nav">
    <button type="button" data-ws="mc" class="active" onclick="setWorkspace('mc')">Suivi MC</button>
    <button type="button" data-ws="gps" onclick="setWorkspace('gps')">Collecte GPS</button>
    <button type="button" data-ws="carto" onclick="setWorkspace('carto')">Carte A4</button>
  </nav>
  <div style="display:flex;gap:8px;align-items:center">
    <button type="button" class="btn acc" onclick="setWorkspace('carto')">Planche A4 (<span id="top-sites-cnt">0</span>)</button>
  </div>
</header>

<div class="wrap">
  <div id="toastArea" class="no-print"></div>

  <!-- WORKSPACE 1: SUIVI MC -->
  <section id="ws-mc" class="panel active">
    <div class="filterbar no-print">
      <label class="fld">Période
        <select id="mc-f-period" onchange="mcFilterChange()">
          <option value="all">Tout l'historique</option>
          <option value="week">Cette semaine</option>
          <option value="month">Ce mois</option>
          <option value="year">Cette année</option>
          <option value="custom">Personnalisé</option>
        </select>
      </label>
      <label class="fld">Année
        <select id="mc-f-year" onchange="mcFilterChange()"><option value="">Toutes</option></select>
      </label>
      <label class="fld">Semaine ISO
        <select id="mc-f-week" onchange="mcFilterChange()"><option value="">Toutes</option></select>
      </label>
      <label class="fld">Village / Zone
        <select id="mc-f-vil" onchange="mcFilterChange()"><option value="">Tous</option></select>
      </label>
      <div id="mc-f-custom" style="display:none;gap:6px;align-items:end">
        <label class="fld">Du<input id="mc-f-from" type="date" onchange="mcFilterChange()"></label>
        <label class="fld">Au<input id="mc-f-to" type="date" onchange="mcFilterChange()"></label>
      </div>
      <button type="button" class="btn" onclick="mcResetFilters()">Réinitialiser</button>
      <button type="button" class="btn pri" onclick="mcExportXlsx()">Excel Complet (.xlsx)</button>
      <button type="button" class="btn" onclick="mcExportJson()">Backup JSON</button>
    </div>

    <div class="subtabs no-print" id="mc-tabs"></div>
    <div id="mc-body"></div>
  </section>

  <!-- WORKSPACE 2: COLLECTE GPS & TRAJETS -->
  <section id="ws-gps" class="panel">
    <div class="subtabs no-print">
      <button type="button" class="active" data-gtab="collect" onclick="setGpsTab('collect')">1. Collecter Point GPS</button>
      <button type="button" data-gtab="list" onclick="setGpsTab('list')">2. Liste Points (<span id="gps-cnt">0</span>)</button>
      <button type="button" data-gtab="tracks" onclick="setGpsTab('tracks')">3. Trajets GPX (<span id="trk-cnt">0</span>)</button>
      <button type="button" data-gtab="io" onclick="setGpsTab('io')">4. Import / Exports (.xlsx, .gpx, .kml, .kmz)</button>
    </div>
    <div id="gps-body"></div>
  </section>

  <!-- WORKSPACE 3: CARTE A4 -->
  <section id="ws-carto" class="panel">
    <div class="carto-layout">
      <aside class="card no-print" style="margin:0">
        <h3>Configuration Carte A4</h3>
        <div style="display:flex;flex-direction:column;gap:9px">
          <label class="fld">Titre principal<input id="c-title" oninput="cartoInput()"></label>
          <label class="fld">Sous-titre<input id="c-sub" oninput="cartoInput()"></label>
          <label class="fld">Organisation<input id="c-brand" oninput="cartoInput()"></label>
          <label class="fld">Note méthodologique<textarea id="c-note" rows="3" oninput="cartoInput()"></textarea></label>
          <label class="fld">Pied de page<input id="c-footer" oninput="cartoInput()"></label>
          <div style="display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px solid var(--line);font-size:12px">
            <label style="display:flex;justify-content:space-between;align-items:center"><span>Frontière Mauritanie–Mali</span><input id="c-brd" type="checkbox" style="width:auto" onchange="cartoInput()"></label>
            <label style="display:flex;justify-content:space-between;align-items:center"><span>Hachures Mali</span><input id="c-mali" type="checkbox" style="width:auto" onchange="cartoInput()"></label>
            <label style="display:flex;justify-content:space-between;align-items:center"><span>Enveloppes de zones</span><input id="c-hull" type="checkbox" style="width:auto" onchange="cartoInput()"></label>
            <label style="display:flex;justify-content:space-between;align-items:center"><span>Grille WGS84</span><input id="c-grid" type="checkbox" style="width:auto" onchange="cartoInput()"></label>
            <label style="display:flex;justify-content:space-between;align-items:center"><span>Trajets GPX visibles</span><input id="c-trk" type="checkbox" style="width:auto" onchange="cartoInput()"></label>
            <label style="display:flex;justify-content:space-between;align-items:center"><span>Tampons frontière</span>
              <select id="c-buf" style="width:auto;padding:4px 8px" onchange="cartoInput()">
                <option value="none">Aucun</option>
                <option value="10">10 km</option>
                <option value="10-20">10 &amp; 20 km</option>
              </select>
            </label>
          </div>
          <div style="padding-top:8px;border-top:1px solid var(--line)">
            <div style="font-size:11px;font-weight:700;color:#0f172a;margin-bottom:6px">Présence de réfugiés (cercle sur la carte)</div>
            <input id="c-ref-q" type="search" placeholder="Filtrer un village ou site..." oninput="renderCartoRefList()" style="margin-bottom:6px;padding:5px 8px;font-size:11.5px">
            <div id="c-ref-list" style="max-height:190px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;background:#fff"></div>
          </div>
          <div style="padding-top:8px;border-top:1px solid var(--line)">
            <label class="btn" style="width:100%;cursor:pointer">Importer Excel / GPX / KML / KMZ / JSON
              <input type="file" accept=".xlsx,.csv,.gpx,.kml,.kmz,.json" style="display:none" onchange="cartoImportFile(this.files[0]);this.value=''">
            </label>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:8px;border-top:1px solid var(--line)">
            <button type="button" class="btn acc" onclick="cartoDlPdf()">PDF A4 300 DPI</button>
            <button type="button" class="btn dark" onclick="cartoDlPng()">PNG 300 DPI</button>
            <button type="button" class="btn" onclick="cartoDlSvg()">SVG Vectoriel</button>
            <button type="button" class="btn" onclick="cartoDlKmz()">KMZ Earth</button>
            <button type="button" class="btn pri" style="grid-column:span 2" onclick="window.print()">Imprimer Planche A4</button>
          </div>
        </div>
      </aside>
      <div>
        <div class="svg-stage" id="carto-stage"></div>
      </div>
    </div>
  </section>
</div>

<!-- MODAL APERCU IMPRESSION RAPPORT -->
<div id="print-modal" class="modal-backdrop">
  <div class="modal-box">
    <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px">
      <strong id="print-modal-title" style="color:var(--pri)">Rapport</strong>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn dark" onclick="window.print()">Imprimer / PDF</button>
        <button type="button" class="btn" onclick="closePrintModal()">Fermer</button>
      </div>
    </div>
    <div id="print-modal-body" class="print-doc"></div>
  </div>
</div>

<!-- MODAL MODIFICATION ENTREE SUIVI MC -->
<div id="mc-edit-modal" class="modal-backdrop no-print">
  <div class="modal-box" style="max-width:740px">
    <form onsubmit="saveMcEdit(event)">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px">
        <strong id="mc-edit-title" style="color:var(--pri);font-size:15px">Modifier l’entrée</strong>
        <button type="button" class="btn sm" onclick="closeMcEdit()">Fermer</button>
      </div>
      <div id="mc-edit-fields" class="grid"></div>
      <div id="mc-edit-hint" class="totline" style="display:none;margin-top:12px"></div>
      <div style="margin-top:14px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:12px">
        <button type="button" class="btn" onclick="closeMcEdit()">Annuler</button>
        <button type="submit" class="btn pri">Enregistrer les modifications</button>
      </div>
    </form>
  </div>
</div>

function parseCsvRows(text){

      if(ch==='"'){ if(inq&&line[i+1]==='"'){cur+='"';i++;}else inq=!inq; }
      else if(ch===sep&&!inq){ out.push(cur.trim()); cur=''; }

    }
    out.push(cur.trim());
    return out;
  });
}

function mcListExportCsv(key){

async function mcListImportFile(key,file){
  if(!file)return;
  try{
    var sc=MC_SCHEMAS[key], sheets=await parseSpreadsheet(file);
    var sh=sheets.find(function(s){return normHdr(s.name)===normHdr(sc.sheet);}) || sheets[0];
    if(!sh||sh.rows.length<2){ toast('Le fichier doit contenir une ligne d’en-tête et des données.','err'); return; }
    var hdrs=sh.rows[0].map(normHdr);
    var idxs=sc.cols.map(function(col){
      var cands=[normHdr(col[1]),normHdr(col[0])].concat((col[3]||[]).map(normHdr));
      var ix=hdrs.findIndex(function(h){return cands.includes(h);});
      if(ix<0) ix=hdrs.findIndex(function(h){return h && cands.some(function(c){return c.length>=3&&(h.includes(c)||c.includes(h));});});
      return ix;
    });
    if(idxs.every(function(i){return i<0;})){ toast('Colonnes incompatibles avec « '+sc.label+' ». Téléchargez le modèle (.xlsx).','err'); return; }
    var today=new Date().toISOString().slice(0,10), added=0;
    for(var r=1;r<sh.rows.length;r++){
      var row=sh.rows[r]; if(!row.some(function(v){return String(v||'').trim()!=='';}))continue;
      var rec={};
      sc.cols.forEach(function(col,ci){
        var raw=idxs[ci]>=0?String(row[idxs[ci]]||'').trim():'';
        if(col[2]==='num'){ var num=parseFloat(raw.replace(',','.')); rec[col[0]]=isFinite(num)?num:(col[4]!=null?col[4]:0); }
        else if(col[2]==='date'){ rec[col[0]]=raw?normDateVal(raw):today; }
        else rec[col[0]]=raw||(col[4]!=null?col[4]:'');
      });
      STATE.mc[key].push(rec);
      if(sc.vf && rec[sc.vf]) ensureVillage(rec[sc.vf]);
      added++;
    }
    saveMc(); renderMc();
    toast(added+' ligne(s) importée(s) dans « '+sc.label+' ».','ok');
  }catch(e){ toast('Erreur import : '+(e.message||e),'err'); }
}

function allMcVillages(){
  var s={};

  STATE.carto.sites.forEach(function(p){if(p.name)s[p.name]=1;});

}
function ensureVillage(nom){
  var t=String(nom||'').trim();
  if(!t||VILLAGES_BASE.includes(t)||STATE.mc.villages.some(function(v){return v.nom===t;}))return;
  STATE.mc.villages.push({nom:t,zone:'Bassikounou',type:'Campement',lat:'',lon:'',men:0,pop:0,chef:'',tel:'',obs:'Ajout auto'});
}
function isoWeek(ds){
  if(!ds)return null;var d=new Date(ds);if(isNaN(d.getTime()))return null;
  d.setHours(0,0,0,0);d.setDate(d.getDate()+3-((d.getDay()+6)%7));
  var w=new Date(d.getFullYear(),0,4);
  return 1+Math.round(((d.getTime()-w.getTime())/86400000-3+((w.getDay()+6)%7))/7);
}
function matchMc(r){
  if(!r)return true;
  var ds=r.date||r.dar||'';
  if(mcFilters.vil){var v=r.vil||r.zone||r.des||'';if(v!==mcFilters.vil)return false;}
  if(mcFilters.year){if(!ds||String(new Date(ds).getFullYear())!==String(mcFilters.year))return false;}
  if(mcFilters.week){if(!ds||String(isoWeek(ds))!==String(mcFilters.week))return false;}
  if(mcFilters.period&&mcFilters.period!=='all'){
    if(!ds)return false;var d=new Date(ds),now=new Date();if(isNaN(d.getTime()))return false;
    if(mcFilters.period==='week'&&(isoWeek(ds)!==isoWeek(now.toISOString().slice(0,10))||d.getFullYear()!==now.getFullYear()))return false;
    if(mcFilters.period==='month'&&(d.getMonth()!==now.getMonth()||d.getFullYear()!==now.getFullYear()))return false;
    if(mcFilters.period==='year'&&d.getFullYear()!==now.getFullYear())return false;
    if(mcFilters.period==='custom'){if(mcFilters.from&&ds<mcFilters.from)return false;if(mcFilters.to&&ds>mcFilters.to)return false;}
  }
  return true;
}

function saveMcEdit(e){
  e.preventDefault();
  if(!_mcEditCtx)return;
  var key=_mcEditCtx.key, idx=_mcEditCtx.idx, cols=_mcEditCtx.cols;
  var arr=STATE.mc[key]||[], orig=arr[idx];
  if(!orig){closeMcEdit();return;}
  var sc=MC_SCHEMAS[key], next=Object.assign({},orig);
  cols.forEach(function(col){
    var ck=col[0], tp=col[2], fid='mce_'+ck;
    var isVil=(sc.vf&&ck===sc.vf)||(ck==='vil')||(key==='mvts'&&ck==='des')||(key==='lmp'&&ck==='des');
    if(isVil){
      next[ck]=readVilVal(fid);
    } else if(tp==='num'){
      var raw=document.getElementById(fid)?document.getElementById(fid).value:'0';
      next[ck]=Number(raw)||0;
    } else {
      next[ck]=document.getElementById(fid)?document.getElementById(fid).value:'';
    }
  });
  if(key==='refs'&&next.date&&next.dar){
    next.delai=Math.round((new Date(next.dar).getTime()-new Date(next.date).getTime())/864e5);
  }
  if(key==='mvts'){
    var s1=(Number(next.h)||0)+(Number(next.f)||0)+(Number(next.g)||0)+(Number(next.fi)||0);
    if(s1>0)next.n=s1;
  } else if(key==='lmp'){
    var s2=(Number(next.h)||0)+(Number(next.f)||0)+(Number(next.g)||0)+(Number(next.fi)||0);
    if(s2>0)next.n=s2;
  } else if(key==='chron'){
    if(next.stat==='Suivi régulier'||next.stat==='Relancé')next.abs=0;
  }
  if(sc&&sc.vf&&next[sc.vf])ensureVillage(next[sc.vf]);
  arr[idx]=next;
  saveMc();
  closeMcEdit();
  toast('Modification enregistrée ('+sc.label+').','ok');
  renderMc();
}

var _lastCols={};

  _lastCols[key]=cols;

  var rows=raw.map(function(r,i){return {r:r,i:i};}).filter(function(x){

    return normHdr(JSON.stringify(x.r)).includes(q);

function submitMcForm(e,key,spec){
  e.preventDefault();
  var obj={};
  spec.forEach(function(f){
    if(f[1]==='vil') obj[f[0]]=readVilVal(f[2]);
    else if(f[1]==='num') obj[f[0]]=Number(document.getElementById(f[2]).value)||0;
    else obj[f[0]]=document.getElementById(f[2]).value||'';
  });
  if(MC_SCHEMAS[key]&&MC_SCHEMAS[key].vf&&obj[MC_SCHEMAS[key].vf]) ensureVillage(obj[MC_SCHEMAS[key].vf]);
  STATE.mc[key].push(obj); saveMc(); toast('Enregistré dans '+MC_SCHEMAS[key].label+'.','ok'); renderMc();
}

function autoVilGps(){
  var laEl=document.getElementById('vg_la'),loEl=document.getElementById('vg_lo'),msgEl=document.getElementById('vg_gps_msg');
  if(!navigator.geolocation){ if(msgEl)msgEl.textContent='GPS non disponible.'; return; }
  if(msgEl)msgEl.textContent='Acquisition GPS en cours...';
  navigator.geolocation.getCurrentPosition(function(p){
    if(laEl)laEl.value=p.coords.latitude.toFixed(6);
    if(loEl)loEl.value=p.coords.longitude.toFixed(6);
    if(msgEl)msgEl.textContent='Fix GPS : '+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5)+' (±'+Math.round(p.coords.accuracy)+' m)';
  },function(e){ if(msgEl)msgEl.textContent='GPS : '+e.message; },{enableHighAccuracy:true,timeout:12000});
}
function mcAddVillage(e){
  e.preventDefault();
  var nom=document.getElementById('vg_n').value.trim(),zone=document.getElementById('vg_z').value.trim(),typ=document.getElementById('vg_t').value;
  var latS=document.getElementById('vg_la').value.trim(),lonS=document.getElementById('vg_lo').value.trim();
  var la=parseFloat(latS),lo=parseFloat(lonS),men=Number(document.getElementById('vg_m').value)||0,pop=Number(document.getElementById('vg_p').value)||0;
  var chef=document.getElementById('vg_ch').value.trim(),tel=document.getElementById('vg_tel').value.trim(),obs=document.getElementById('vg_ob').value.trim();
  if(!nom)return;
  STATE.mc.villages.push({nom:nom,zone:zone,type:typ,lat:latS,lon:lonS,men:men,pop:pop,chef:chef,tel:tel,obs:obs});
  saveMc();
  if(isFinite(la)&&isFinite(lo)){
    var zMatch=STATE.carto.zones.find(function(z){return z.name.toLowerCase()===zone.toLowerCase();})||STATE.carto.zones[0];
    STATE.carto.sites.push({id:'mc-'+Date.now().toString(36),zoneId:zMatch?zMatch.id:'',name:nom,lat:la,lon:lo,status:'mauritanien',typ:typ,men:men,pers:pop,chef:chef,tel:tel,obs:obs});
    saveCarto();
  }

  renderMc();

function statBox(val,lbl,target){
  var cls='';
  var pct='';
  if(target&&typeof val==='number'&&target>0){
    var r=val/target; pct=' / '+target+' ('+Math.round(r*100)+'%)';
    cls=r<0.75?' bad':(r<1?' warn':' good');
  }
  return '<div class="kpi'+cls+'"><div class="val">'+val+'</div><div class="lbl">'+esc(lbl+pct)+'</div></div>';
}
function svgBarChart(title,items){
  if(!items.length)return '<div class="card"><h3>'+esc(title)+'</h3><p style="color:var(--muted);font-size:12px">Aucune donnée.</p></div>';
  var max=Math.max(1,Math.max.apply(null,items.map(function(x){return x.v;})));
  var W=520,H=190,bw=Math.max(18,Math.min(48,(W-40)/items.length-10));
  return '<div class="card"><h3>'+esc(title)+'</h3><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+items.map(function(it,i){
    var bh=Math.round((it.v/max)*(H-54)),x=24+i*(bw+12),y=H-30-bh;

  }).join('')+'</svg></div>';

function svgDonutChart(title,segs){
  var tot=segs.reduce(function(a,s){return a+s.v;},0);
  if(!tot)return '<div class="card"><h3>'+esc(title)+'</h3><p style="color:var(--muted);font-size:12px">Aucune donnée.</p></div>';
  var C=2*Math.PI*38,acc=0;
  return '<div class="card"><h3>'+esc(title)+'</h3><div style="display:flex;align-items:center;gap:16px"><svg viewBox="0 0 110 110" width="110" height="110"><circle cx="55" cy="55" r="38" fill="none" stroke="#f1f5f9" stroke-width="14"/>'+segs.map(function(s){
    var frac=s.v/tot,dash=(frac*C).toFixed(2)+' '+(C*(1-frac)).toFixed(2),off=(-acc*C+C*0.25).toFixed(2);acc+=frac;
    return '<circle cx="55" cy="55" r="38" fill="none" stroke="'+s.c+'" stroke-width="14" stroke-dasharray="'+dash+'" stroke-dashoffset="'+off+'"/>';
  }).join('')+'<text x="55" y="55" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="800" fill="#0f172a">'+tot+'</text></svg><div style="display:flex;flex-direction:column;gap:4px;font-size:12px">'+segs.map(function(s){return '<div><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+s.c+';margin-right:6px"></span><b>'+esc(s.l)+'</b> : '+s.v+' ('+Math.round((s.v/tot)*100)+'%)</div>';}).join('')+'</div></div></div>';
}

  var CH_ALIAS={nom:['nom','nom et prenom','nom complet','patient','noms'],pre:['prenom','prenoms'],sex:['sexe','sex'],age:['age'],vil:['village','site','localite'],
    patho:['pathologie','maladie','diagnostic','type de maladie'],typeD:['type diabete','type de diabete'],dinc:['date inclusion','date d inclusion','date inscription','date'],
    trt:['traitement'],stat:['statut suivi','statut','etat'],obs:['observations','observation','remarques']};
  function normPatho(s){var k=nz(s),h=/hta|hypertens/.test(k),d=/diab/.test(k);return h&&d?'HTA + Diabète':h?'HTA':d?'Diabète':'';}
  function normStat(s){var k=nz(s);if(!k)return 'Suivi régulier';if(/perdu/.test(k))return 'Perdu de vue';if(/absent/.test(k))return 'Absent';if(/dece/.test(k))return 'Décédé';if(/relanc/.test(k))return 'Relancé';if(/abandon/.test(k))return 'Abandon';if(/transf/.test(k))return 'Transféré';return 'Suivi régulier';}
  function matchVillage(s){
    var k=nz(s);if(!k)return '';
    var vs=chronVillages(),i;
    for(i=0;i<vs.length;i++){if(nz(vs[i])===k)return vs[i];}
    var AL=[['abbag','Abbague'],['abag','Abbague'],['bir','Bir Albarka'],['lihw','Lihweyra'],['boum','Boumediane'],['disha','Disha'],['dicha','Disha'],['hassi tw','Hassi Twil'],['hassi tou','Hassi Twil']];
    for(i=0;i<AL.length;i++){if(k.indexOf(AL[i][0])===0)return AL[i][1];}
    return '';
  }
  function analyseChron(sheets){
    var seen={},out=[],rep=[],existing={};
    STATE.mc.chron.forEach(function(p){existing[nz(p.nom)+'|'+nz(p.pre)+'|'+nz(p.patho)]=1;});
    sheets.forEach(function(sh){
      var rows=sh.rows||[],hi=-1,map={};
      for(var r=0;r<Math.min(rows.length,8);r++){
        var hd=(rows[r]||[]).map(nz),m={},c=0;
        Object.keys(CH_ALIAS).forEach(function(k){var ix=hd.findIndex(function(h){return CH_ALIAS[k].indexOf(h)>=0;});if(ix>=0){m[k]=ix;c++;}});
        if(m.nom!=null&&c>=2){hi=r;map=m;break;}
      }
      var st={name:sh.name,lus:0,nouveaux:0,doublons:0,sansnom:0};
      if(hi<0){st.err='En-têtes non reconnues (colonne « Nom » introuvable).';rep.push(st);return;}
      var shVil=matchVillage(sh.name),shPat=normPatho(sh.name);
      for(var i=hi+1;i<rows.length;i++){
        var row=rows[i]||[];if(!row.some(function(x){return String(x==null?'':x).trim()!=='';}))continue;
        st.lus++;
        function g(k){return map[k]!=null?String(row[map[k]]==null?'':row[map[k]]).trim():'';}
        var nom=g('nom'),pre=g('pre');
        if(!nom){st.sansnom++;continue;}
        var patho=normPatho(g('patho'))||shPat;
        var vil=map.vil!=null?(matchVillage(g('vil'))||g('vil')):shVil;
        var key=nz(nom)+'|'+nz(pre)+'|'+nz(patho);
        if(existing[key]||seen[key]){st.doublons++;continue;}
        seen[key]=1;st.nouveaux++;
        var di=g('dinc'),dinc=/^\d{4}-\d{2}-\d{2}/.test(di)?di.slice(0,10):(typeof excelSerialToIso==='function'&&/^\d+(\.\d+)?$/.test(di)?(excelSerialToIso(Number(di))||''):'');
        out.push({id:uid(),nom:nom,pre:pre,sex:g('sex').toUpperCase().charAt(0)==='H'?'M':g('sex').toUpperCase().charAt(0),age:g('age'),vil:vil,patho:patho||'HTA',typeD:g('typeD'),
          dinc:dinc,trt:g('trt'),ta:'',gly:'',dpass:'',rdv:'',stat:normStat(g('stat')),abs:/perdu/.test(nz(g('stat')))?2:(/absent/.test(nz(g('stat')))?1:0),obs:g('obs')});
      }
      rep.push(st);
    });
    return {rows:out,rep:rep};
  }

// Universal Geospatial + Excel Importer (GPX / KML / KMZ / XLSX / CSV / JSON)
function segDistKm(seg){
  var d=0; for(var i=1;i<seg.length;i++)d+=Math.hypot((seg[i][0]-seg[i-1][0])*111.2,(seg[i][1]-seg[i-1][1])*kmPerLon(seg[i][0]));
  return Number(d.toFixed(2));
}
async function parseAnyMapFile(file){
  var buf=await file.arrayBuffer(), lower=file.name.toLowerCase(), pts=[], trks=[];
  var defZ=STATE.carto.zones[0]?STATE.carto.zones[0].id:'';
  function zIdByName(zn){
    if(!zn)return defZ;
    var f=STATE.carto.zones.find(function(z){return normHdr(z.name).includes(normHdr(zn))||normHdr(zn).includes(normHdr(z.name));});
    return f?f.id:defZ;
  }
  function parseKmlTxt(txt){
    var doc=new DOMParser().parseFromString(txt,'text/xml');
    Array.from(doc.querySelectorAll('Placemark')).forEach(function(pm,i){
      var nm=(pm.querySelector('name')&&pm.querySelector('name').textContent||'').trim()||('Point '+(i+1));
      var pt=pm.querySelector('Point coordinates');
      if(pt){
        var p=pt.textContent.trim().split(',');
        var lo=parseFloat(p[0]),la=parseFloat(p[1]),al=parseFloat(p[2]);
        if(isFinite(la)&&isFinite(lo))pts.push({name:nm,lat:la,lon:lo,alt:isFinite(al)?Math.round(al):null,zoneId:defZ,status:'mauritanien',typ:'Village',obs:(pm.querySelector('description')&&pm.querySelector('description').textContent||'').trim()});
      }
      var ls=pm.querySelectorAll('LineString coordinates');
      if(ls.length){
        var segs=[]; ls.forEach(function(el){
          var arr=el.textContent.trim().split(/\s+/).map(function(c){var p=c.split(',');return [parseFloat(p[1]),parseFloat(p[0])];}).filter(function(x){return isFinite(x[0])&&isFinite(x[1]);});
          if(arr.length>1)segs.push(arr);
        });
        if(segs.length) trks.push({id:'trk-k-'+Date.now()+'-'+i,name:nm,distKm:segs.reduce(function(a,s){return a+segDistKm(s);},0),segs:segs,visible:true});
      }
    });
  }
  if(isZipBuf(buf)){
    var ents=listZipEntries(buf);
    if(ents.some(function(e){return e.name==='xl/workbook.xml'||e.name.startsWith('xl/worksheets/');})){
      var shs=await parseXlsxBuf(buf);
      shs.forEach(function(sh){
        if(sh.rows.length<2)return;
        var h=sh.rows[0].map(normHdr);
        var iLa=h.findIndex(function(x){return /^lat/.test(x);}), iLo=h.findIndex(function(x){return /^(lon|lng|long)/.test(x);});
        if(iLa<0||iLo<0)return;
        var iN=h.findIndex(function(x){return /^(nom|name|village|lieu|site)/.test(x);});
        var iZ=h.findIndex(function(x){return x.includes('zone');}), iCh=h.findIndex(function(x){return x.includes('chef');}), iTe=h.findIndex(function(x){return x.includes('tel');});
        var iMn=h.findIndex(function(x){return x.includes('menag');}), iPr=h.findIndex(function(x){return x.includes('person')||x==='pop';}), iOb=h.findIndex(function(x){return x.includes('obs');});
        for(var r=1;r<sh.rows.length;r++){
          var row=sh.rows[r],la=parseFloat(String(row[iLa]||'').replace(',','.')),lo=parseFloat(String(row[iLo]||'').replace(',','.'));
          if(!isFinite(la)||!isFinite(lo))continue;
          pts.push({name:(iN>=0?row[iN]:'')||('Point '+r),lat:la,lon:lo,zoneId:zIdByName(iZ>=0?row[iZ]:''),status:'mauritanien',typ:'Village',chef:iCh>=0?row[iCh]:'',tel:iTe>=0?row[iTe]:'',men:iMn>=0?(Number(row[iMn])||null):null,pers:iPr>=0?(Number(row[iPr])||null):null,obs:iOb>=0?row[iOb]:''});
        }
      });
    } else {
      var kEnt=ents.find(function(e){return /doc\.kml$/i.test(e.name);})||ents.find(function(e){return /\.kml$/i.test(e.name);});
      if(kEnt) parseKmlTxt(await readZipEntryText(buf,kEnt));
    }
  } else {
    var txt=new TextDecoder('utf-8').decode(buf);
    if(lower.endsWith('.json')){
      var j=JSON.parse(txt),arr=Array.isArray(j)?j:(j.sites||j.points||[]);
      arr.forEach(function(s,i){ var la=Number(s.lat!=null?s.lat:s.latitude),lo=Number(s.lon!=null?s.lon:s.longitude); if(isFinite(la)&&isFinite(lo))pts.push(Object.assign({},s,{name:s.name||s.nom||('Point '+(i+1)),lat:la,lon:lo,zoneId:s.zoneId||defZ,status:s.status||'mauritanien'})); });
      if(Array.isArray(j.tracks)) trks=j.tracks;
    } else if(lower.endsWith('.kml')){
      parseKmlTxt(txt);
    } else if(lower.endsWith('.gpx')||txt.includes('<gpx')){
      var gDoc=new DOMParser().parseFromString(txt,'text/xml');
      Array.from(gDoc.querySelectorAll('wpt')).forEach(function(w,i){
        var la=parseFloat(w.getAttribute('lat')),lo=parseFloat(w.getAttribute('lon'));
        if(isFinite(la)&&isFinite(lo))pts.push({name:(w.querySelector('name')&&w.querySelector('name').textContent||'').trim()||('Point '+(i+1)),lat:la,lon:lo,zoneId:defZ,status:'mauritanien',typ:'Village'});
      });
      Array.from(gDoc.querySelectorAll('trk')).forEach(function(tr,idx){
        var segs=[]; tr.querySelectorAll('trkseg').forEach(function(sg){ var arr=[]; sg.querySelectorAll('trkpt').forEach(function(tp){var la=parseFloat(tp.getAttribute('lat')),lo=parseFloat(tp.getAttribute('lon'));if(isFinite(la)&&isFinite(lo))arr.push([la,lo]);}); if(arr.length>1)segs.push(arr); });
        if(segs.length) trks.push({id:'trk-g-'+Date.now()+'-'+idx,name:(tr.querySelector('name')&&tr.querySelector('name').textContent||'Trajet '+(idx+1)),distKm:segs.reduce(function(a,s){return a+segDistKm(s);},0),segs:segs,visible:true});
      });
    } else {
      var rows=parseCsvRows(txt);
      if(rows.length>=2){
        var h=rows[0].map(normHdr),iLa=h.findIndex(function(x){return /^lat/.test(x);}),iLo=h.findIndex(function(x){return /^(lon|lng|long)/.test(x);}),iN=h.findIndex(function(x){return /^(nom|name|village|lieu|site)/.test(x);});
        if(iLa>=0&&iLo>=0){ for(var r=1;r<rows.length;r++){ var la=parseFloat(String(rows[r][iLa]||'').replace(',','.')),lo=parseFloat(String(rows[r][iLo]||'').replace(',','.')); if(isFinite(la)&&isFinite(lo))pts.push({name:(iN>=0?rows[r][iN]:'')||('Point '+r),lat:la,lon:lo,zoneId:defZ,status:'mauritanien',typ:'Village'}); } }
      }
    }
  }
  return {pts:pts,trks:trks};
}
async function cartoImportFile(f){
  if(!f)return;

    var res=await parseAnyMapFile(f);
    res.pts.forEach(function(p,i){ STATE.carto.sites.push(Object.assign({id:'imp-'+Date.now()+'-'+i},p)); });
    if(res.trks.length) STATE.carto.tracks=STATE.carto.tracks.concat(res.trks);
    saveCarto(); renderCartoSvg(); renderCartoRefList();
    toast('Carte mise à jour : '+res.pts.length+' site(s) et '+res.trks.length+' trajet(s) importés.','ok');
  }catch(e){ toast('Erreur import : '+(e.message||e),'err'); }
}
async function gpsPreviewImport(f){
  if(!f)return;
  try{
    var res=await parseAnyMapFile(f);
    if(res.trks.length){ STATE.carto.tracks=STATE.carto.tracks.concat(res.trks); saveCarto(); }
    impCands=res.pts.map(function(p){
      var dup=STATE.carto.sites.some(function(s){return Math.hypot((s.lat-p.lat)*111200,(s.lon-p.lon)*kmPerLon(p.lat)*1000)<50;});
      return Object.assign({},p,{dup:dup,on:!dup});
    });
    if(!impCands.length && res.trks.length) toast(res.trks.length+' trajet(s) importés dans Trajets GPX.','ok');
    else if(!impCands.length) toast('Aucun point GPS trouvé dans ce fichier.','err');
    renderGps();
  }catch(e){ toast('Erreur import : '+(e.message||e),'err'); }
}
function confirmImpCands(){

  var sel=impCands.filter(function(c){return c.on;});
  sel.forEach(function(c,i){ var o=cloneObj(c); delete o.dup; delete o.on; o.id='imp-'+Date.now()+'-'+i; STATE.carto.sites.push(o); });
  impCands=null; saveCarto(); renderGps();

function kmPerLon(la){return 111.32*Math.cos(la*Math.PI/180);}
function distPtSegKm(la,lo,a,b){
  var kx=kmPerLon((la+a[0]+b[0])/3),px=lo*kx,py=la*111.2,ax=a[1]*kx,ay=a[0]*111.2,bx=b[1]*kx,by=b[0]*111.2;
  var dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy,t=l2>0?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2)):0;
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function distBorderKm(la,lo,poly){
  if(!poly||poly.length<2)return 0;var m=Infinity;
  for(var i=0;i<poly.length-1;i++){var d=distPtSegKm(la,lo,poly[i],poly[i+1]);if(d<m)m=d;}
  return m;
}
function bufHull(pts,radKm){
  if(!pts.length)return [];var ring=[],st=24;
  for(var i=0;i<pts.length;i++){var p=pts[i],kx=kmPerLon(p.lat);for(var t=0;t<st;t++){var a=2*Math.PI*t/st;ring.push([p.lon+(radKm/kx)*Math.cos(a),p.lat+(radKm/111.2)*Math.sin(a)]);}}

  function cr(o,a,b){return (a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);}
  var lo=[],hi=[];
  for(var i=0;i<ring.length;i++){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],ring[i])<=0)lo.pop();lo.push(ring[i]);}
  for(var i=ring.length-1;i>=0;i--){while(hi.length>=2&&cr(hi[hi.length-2],hi[hi.length-1],ring[i])<=0)hi.pop();hi.push(ring[i]);}
  return lo.slice(0,-1).concat(hi.slice(0,-1));
}
function westOffsetKm(poly,offKm){
  if(!poly||poly.length<2||offKm<=0)return [];
  var mLat=poly.reduce(function(a,p){return a+p[0];},0)/poly.length,kx=kmPerLon(mLat);
  var pts=poly.map(function(p){return [p[1]*kx,p[0]*111.2];});
  if(pts[0][1]<pts[pts.length-1][1])pts.reverse();
  var clean=[pts[0]];
  for(var i=1;i<pts.length;i++){var pr=clean[clean.length-1];if(Math.hypot(pts[i][0]-pr[0],pts[i][1]-pr[1])>0.05)clean.push(pts[i]);}
  if(clean.length<2)return [];
  var segs=[];
  for(var i=0;i<clean.length-1;i++){
    var p0=clean[i],p1=clean[i+1],dx=p1[0]-p0[0],dy=p1[1]-p0[1],len=Math.hypot(dx,dy);if(len<1e-6)continue;
    var nx=dy/len,ny=-dx/len;
    segs.push({a:[p0[0]+nx*offKm,p0[1]+ny*offKm],b:[p1[0]+nx*offKm,p1[1]+ny*offKm],n:[nx,ny]});
  }
  if(!segs.length)return [];
  var out=[segs[0].a];
  for(var i=0;i<segs.length-1;i++){
    var s1=segs[i],s2=segs[i+1],co=clean[i+1],c=s1.n[0]*s2.n[1]-s1.n[1]*s2.n[0];
    if(Math.abs(c)<1e-3)out.push(s1.b);
    else if(c>0){
      var a1=Math.atan2(s1.n[1],s1.n[0]),a2=Math.atan2(s2.n[1],s2.n[0]);while(a2<a1)a2+=2*Math.PI;
      var k=Math.max(4,Math.ceil(((a2-a1)/(Math.PI/2))*10));
      for(var j=0;j<=k;j++){var ag=a1+((a2-a1)*j)/k;out.push([co[0]+Math.cos(ag)*offKm,co[1]+Math.sin(ag)*offKm]);}
    }else{
      var d1x=s1.b[0]-s1.a[0],d1y=s1.b[1]-s1.a[1],d2x=s2.b[0]-s2.a[0],d2y=s2.b[1]-s2.a[1],dn=d1x*d2y-d1y*d2x;
      if(Math.abs(dn)>1e-6){var t=((s2.a[0]-s1.a[0])*d2y-(s2.a[1]-s1.a[1])*d2x)/dn;out.push([s1.a[0]+t*d1x,s1.a[1]+t*d1y]);}else out.push(s1.b);
    }
  }
  out.push(segs[segs.length-1].b);

}
function wrapTxt(t,max){
  var ws=String(t||'').trim().split(/\s+/),ln=[],cur='';

function rectsOvArea(a,b,pad){

function renderCartoSvg(){
  var S=STATE.carto,st=S.settings,sites=S.sites.filter(function(s){return s.typ!=='Équipement';}),zones=S.zones,border=S.borderPolyline;
  var SW=1169,SH=827,HH=62,MX=30,MY=72,MW=678,MH=635,LOGO_R=11.5,DX=722,DW=423,CG=12,CW=(DW-CG)/2;
  var zMap={}; zones.forEach(function(z){zMap[z.id]=z;});
  var aZones=zones.filter(function(z){return sites.some(function(s){return s.zoneId===z.id;});});
  var ord=[];
  aZones.forEach(function(z){
    var zs=sites.filter(function(s){return s.zoneId===z.id;});
    ord=ord.concat(zs.filter(function(s){return s.status==='centre';}),zs.filter(function(s){return s.status!=='centre';}));
  });
  var mLa=ord.length?ord.reduce(function(a,s){return a+s.lat;},0)/ord.length:16.25;
  var kx=Math.cos(mLa*Math.PI/180);

  var xs=[],ys=[],hullsGeo={};
  aZones.forEach(function(z){
    var zs=ord.filter(function(s){return s.zoneId===z.id;});

    h.forEach(function(q){xs.push(q[0]*kx);ys.push(q[1]);});

  if(!xs.length){
    var fb=ord.length?ord:[{lat:16.25,lon:-5.55}];

  if(sx/sy>MW/MH)sy=sx*MH/MW;else sx=sy*MW/MH;

  var pos=ord.map(function(s,i){

    var px=gx(s.lon),py=gy(s.lat);
    return Object.assign({},s,{num:i+1,distKm:d,zCol:z?z.color:'#475569',px:px,py:py,dx:px,dy:py});
  });
  var dPx=st.dispersalPx||0;
  if(dPx>0&&pos.length>1){
    var maxDr=Math.max(14,dPx*1.45);
    for(var it=0;it<80;it++){
      var mv=false;
      for(var i=0;i<pos.length;i++){
        var fx=0,fy=0;
        for(var j=0;j<pos.length;j++){if(i===j)continue;var dx=pos[i].dx-pos[j].dx,dy=pos[i].dy-pos[j].dy,dd=Math.hypot(dx,dy);if(dd<0.01){var ag=(i*2.4+j*0.7)%(2*Math.PI);dx=Math.cos(ag);dy=Math.sin(ag);dd=0.5;}if(dd<dPx){var pu=((dPx-dd)/dPx)*2.4;fx+=(dx/dd)*pu;fy+=(dy/dd)*pu;}}
        fx+=(pos[i].px-pos[i].dx)*0.14;fy+=(pos[i].py-pos[i].dy)*0.14;
        if(Math.hypot(fx,fy)>0.08){pos[i].dx+=fx*0.65;pos[i].dy+=fy*0.65;var dr=Math.hypot(pos[i].dx-pos[i].px,pos[i].dy-pos[i].py);if(dr>maxDr){pos[i].dx=pos[i].px+((pos[i].dx-pos[i].px)/dr)*maxDr;pos[i].dy=pos[i].py+((pos[i].dy-pos[i].py)/dr)*maxDr;}pos[i].dx=Math.max(MX+10,Math.min(MX+MW-10,pos[i].dx));pos[i].dy=Math.max(MY+10,Math.min(MY+MH-10,pos[i].dy));mv=true;}
